<!-- 
1.Placeringen av script taggen är viktigt eftersom, själva webbläsaren läser 
HTML koden uppifrån och ned. Sen ifall script taggen hade varit skriven i head utan defer,
hade Javscript körts innan HTML koden hade laddats färdigt. 

2.Attributet defer gör att Javascript filen laddas samtidigt som vårt HTML dokument, 
men det körs först när HTML dokumnetet är inläst.
-->
